<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>Cosmos</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="9" fill="currentColor" opacity="0.92"/>
            <ellipse cx="24" cy="24" rx="20" ry="7.5" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-24 24 24)" opacity="0.55"/>
            <circle cx="41" cy="17" r="1.8" fill="currentColor"/>
          </svg>
          <span class="brand-name">COSMOS</span>
        </div>
        <button class="icon-btn" id="collapse-btn" title="Zwiń panel" aria-label="Zwiń panel">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Nowa rozmowa
      </button>

      <nav class="conversations" id="conversations" aria-label="Lista rozmów"></nav>

      <div class="sidebar-footer">
        <button class="footer-btn" id="settings-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Ustawienia
        </button>
        <button class="footer-btn" id="theme-btn">
          <svg id="theme-icon-dark" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="theme-label">Jasny motyw</span>
        </button>
        <div class="status-block">
          <div class="status-row" id="status-cloud">
            <span class="status-dot"></span>
            <span class="status-name">Chmura NVIDIA</span>
            <span class="status-state">—</span>
          </div>
          <div class="status-row" id="status-local">
            <span class="status-dot"></span>
            <span class="status-name">Lokalny GPU</span>
            <span class="status-state">—</span>
          </div>
          <div class="status-row" id="status-senses">
            <span class="status-dot"></span>
            <span class="status-name">Zmysły</span>
            <span class="status-state">—</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">
      <div class="stars" aria-hidden="true"></div>
      <header class="topbar">
        <button class="icon-btn" id="expand-btn" title="Pokaż panel" aria-label="Pokaż panel">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>

        <div class="endpoint-switch" role="tablist" aria-label="Źródło modelu">
          <button class="endpoint-tab" id="tab-cloud" role="tab" data-endpoint="cloud">
            <svg viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9A7 7 0 0 0 4.3 12.4 3.5 3.5 0 0 0 6.5 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Chmura
          </button>
          <button class="endpoint-tab" id="tab-local" role="tab" data-endpoint="local">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            Lokalnie
          </button>
        </div>

        <button class="icon-btn tts-toggle" id="tts-toggle" title="Czytaj odpowiedzi na głos" aria-label="Czytaj odpowiedzi na głos">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9.5 9.5 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="tts-waves"/></svg>
        </button>
        <div class="topbar-model" id="topbar-model" title="Aktywny model">—</div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <!-- Ekran powitalny -->
        <div class="welcome" id="welcome">
          <svg class="welcome-icon" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="9" fill="currentColor" opacity="0.92"/>
            <ellipse cx="24" cy="24" rx="20" ry="7.5" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-24 24 24)" opacity="0.5"/>
            <circle cx="41" cy="17" r="1.6" fill="currentColor"/>
          </svg>
          <h1>Cosmos</h1>
          <p class="welcome-sub">Aktywny model: <span class="mono" id="welcome-model">—</span></p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-prompt="Wyjaśnij prostymi słowami, jak działa duży model językowy (LLM).">Wyjaśnij, jak działa LLM</button>
            <button class="suggestion" data-prompt="Napisz funkcję w Pythonie, która sprawdza, czy podany rok jest przestępny, i dodaj testy.">Napisz funkcję w Pythonie</button>
            <button class="suggestion" data-prompt="Zaproponuj architekturę systemu, który łączy kamerę głębi, drona i lokalny model AI.">Architektura systemu percepcji</button>
            <button class="suggestion" data-prompt="Porównaj fotogrametrię i skanowanie kamerą głębi do tworzenia modeli 3D.">Fotogrametria vs kamera głębi</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <!-- ================= COMPOSER ================= -->
      <div class="composer-wrap">
        <div class="attachments" id="attachments"></div>
        <div class="composer" id="composer">
          <button class="attach-btn" id="attach-btn" title="Dodaj obraz" aria-label="Dodaj obraz">
            <svg viewBox="0 0 24 24"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="file" id="file-input" accept="image/*" multiple style="display:none">
          <button class="attach-btn" id="camera-btn" title="Zrób zdjęcie kamerą" aria-label="Zrób zdjęcie kamerą">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          </button>
          <button class="attach-btn" id="mic-btn" title="Mów (dyktowanie)" aria-label="Mów">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Napisz wiadomość…"></textarea>
          <button class="send-btn" id="send-btn" title="Wyślij" aria-label="Wyślij">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="stop-btn" id="stop-btn" title="Zatrzymaj generowanie" aria-label="Zatrzymaj" style="display:none">
            <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="disclaimer">Model może popełniać błędy — zweryfikuj ważne informacje. <kbd>Enter</kbd> wyślij · <kbd>Shift+Enter</kbd> nowa linia</p>
      </div>
    </main>
  </div>

  <!-- ================= MODAL: USTAWIENIA ================= -->
  <div class="modal-overlay" id="settings-modal" style="display:none">
    <div class="modal" role="dialog" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Ustawienia</h2>
        <button class="icon-btn" id="settings-close" aria-label="Zamknij">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Model — chmura NVIDIA</span>
          <div class="field-row">
            <input type="text" id="set-model-cloud" placeholder="domyślny z .env" class="mono">
            <button class="btn-secondary" id="fetch-models-cloud">Pobierz listę</button>
          </div>
          <select id="model-select-cloud" style="display:none" class="mono"></select>
        </label>

        <label class="field">
          <span class="field-label">Model — lokalny (RTX / Ollama / vLLM)</span>
          <div class="field-row">
            <input type="text" id="set-model-local" placeholder="domyślny z .env" class="mono">
            <button class="btn-secondary" id="fetch-models-local">Pobierz listę</button>
          </div>
          <select id="model-select-local" style="display:none" class="mono"></select>
          <span class="field-hint">Zostaw pola puste, aby używać modeli z konfiguracji serwera (.env).</span>
        </label>

        <label class="field">
          <span class="field-label">Instrukcja systemowa</span>
          <textarea id="set-system" rows="3" placeholder="np. Jesteś pomocnym asystentem. Odpowiadasz po polsku."></textarea>
        </label>

        <div class="field-grid">
          <label class="field">
            <span class="field-label">Temperatura <span class="mono" id="temp-value">0.6</span></span>
            <input type="range" id="set-temp" min="0" max="1" step="0.05" value="0.6">
          </label>
          <label class="field">
            <span class="field-label">Maks. tokenów odpowiedzi</span>
            <input type="number" id="set-maxtokens" min="16" max="32768" step="16" value="2048" class="mono">
          </label>
        </div>

        <div class="config-info mono" id="config-info"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="settings-reset">Przywróć domyślne</button>
        <button class="btn-primary" id="settings-save">Zapisz</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: KAMERA ================= -->
  <div class="modal-overlay" id="camera-modal" style="display:none">
    <div class="modal camera-modal" role="dialog" aria-label="Kamera">
      <div class="modal-header">
        <h2>Kamera</h2>
        <button class="icon-btn" id="camera-close" aria-label="Zamknij">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="camera-body">
        <video id="camera-video" autoplay playsinline muted></video>
      </div>
      <div class="modal-footer">
        <button class="btn-primary" id="camera-capture">Zrób zdjęcie</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
