<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bear Chat — Nemotron</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BB%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">🐻</span>
          <span class="brand-name">Bear Chat</span>
        </div>
        <button class="icon-btn" id="collapse-btn" title="Zwiń panel" aria-label="Zwiń panel">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Nowa rozmowa
      </button>

      <nav class="conversations" id="conversations" aria-label="Lista rozmów"></nav>

      <div class="sidebar-footer">
        <button class="footer-btn" id="settings-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Ustawienia
        </button>
        <button class="footer-btn" id="theme-btn">
          <svg id="theme-icon-dark" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg id="theme-icon-light" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span id="theme-label">Ciemny motyw</span>
        </button>
        <div class="status-row" id="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Sprawdzanie połączenia…</span>
        </div>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="expand-btn" title="Pokaż panel" aria-label="Pokaż panel">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-model" id="topbar-model" title="Aktywny model">—</div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <!-- Ekran powitalny -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🐻</div>
          <h1>W czym mogę pomóc?</h1>
          <p class="welcome-sub">Rozmawiasz z modelem <strong id="welcome-model">NVIDIA Nemotron</strong></p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion" data-prompt="Wyjaśnij prostymi słowami, jak działa duży model językowy (LLM).">💡 Wyjaśnij, jak działa LLM</button>
            <button class="suggestion" data-prompt="Napisz funkcję w Pythonie, która sprawdza, czy podany rok jest przestępny, i dodaj testy.">🐍 Napisz funkcję w Pythonie</button>
            <button class="suggestion" data-prompt="Zaproponuj plan nauki programowania na 30 dni dla początkującego.">📚 Plan nauki na 30 dni</button>
            <button class="suggestion" data-prompt="Streść w 5 punktach, czym różni się uczenie nadzorowane od nienadzorowanego.">🎓 Uczenie maszynowe w 5 punktach</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <!-- ================= COMPOSER ================= -->
      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Napisz wiadomość… (Enter — wyślij, Shift+Enter — nowa linia)"></textarea>
          <button class="send-btn" id="send-btn" title="Wyślij" aria-label="Wyślij">
            <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="stop-btn" id="stop-btn" title="Zatrzymaj generowanie" aria-label="Zatrzymaj" style="display:none">
            <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="disclaimer">Model może popełniać błędy — zweryfikuj ważne informacje.</p>
      </div>
    </main>
  </div>

  <!-- ================= MODAL: USTAWIENIA ================= -->
  <div class="modal-overlay" id="settings-modal" style="display:none">
    <div class="modal" role="dialog" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Ustawienia</h2>
        <button class="icon-btn" id="settings-close" aria-label="Zamknij">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Model</span>
          <div class="field-row">
            <input type="text" id="set-model" placeholder="np. nvidia/nemotron-nano-9b-v2">
            <button class="btn-secondary" id="fetch-models-btn" title="Pobierz listę modeli z endpointu">Pobierz listę</button>
          </div>
          <select id="model-select" style="display:none"></select>
          <span class="field-hint">Zostaw puste, aby użyć modelu z konfiguracji serwera (.env). Dokładny identyfikator Nemotrona 3 znajdziesz na build.nvidia.com lub przyciskiem „Pobierz listę”.</span>
        </label>

        <label class="field">
          <span class="field-label">Instrukcja systemowa (system prompt)</span>
          <textarea id="set-system" rows="3" placeholder="np. Jesteś pomocnym asystentem. Odpowiadasz po polsku."></textarea>
        </label>

        <div class="field-grid">
          <label class="field">
            <span class="field-label">Temperatura: <strong id="temp-value">0.6</strong></span>
            <input type="range" id="set-temp" min="0" max="1" step="0.05" value="0.6">
          </label>
          <label class="field">
            <span class="field-label">Maks. tokenów odpowiedzi</span>
            <input type="number" id="set-maxtokens" min="16" max="32768" step="16" value="2048">
          </label>
        </div>

        <div class="config-info" id="config-info"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="settings-reset">Przywróć domyślne</button>
        <button class="btn-primary" id="settings-save">Zapisz</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
