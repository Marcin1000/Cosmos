<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Cosmos — hybrid local and cloud AI environment">
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#0a0e1c"/>
      <stop offset="1" stop-color="#12172e"/>
    </linearGradient>
    <radialGradient id="poswiata" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9db9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9db9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeta" x1="0.3" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#c4d5ff"/>
      <stop offset="0.5" stop-color="#9db9ff"/>
      <stop offset="1" stop-color="#5a6fae"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#tlo)"/>

  <!-- Gwiazdy. Rozrzucone ręcznie, nie losowo: przy losowaniu zawsze
       wychodzi kilka par prawie stykających się ze sobą. -->
  <g fill="#ffffff">
    <circle cx="90" cy="52" r="1.6" opacity="0.55"/>
    <circle cx="212" cy="118" r="1.1" opacity="0.35"/>
    <circle cx="148" cy="228" r="1.4" opacity="0.42"/>
    <circle cx="330" cy="64" r="1"   opacity="0.30"/>
    <circle cx="286" cy="252" r="1.3" opacity="0.38"/>
    <circle cx="1044" cy="84" r="1.5" opacity="0.48"/>
    <circle cx="1120" cy="196" r="1.2" opacity="0.34"/>
    <circle cx="962" cy="246" r="1"   opacity="0.28"/>
    <circle cx="1160" cy="58" r="1.7" opacity="0.5"/>
    <circle cx="880" cy="40" r="1.1" opacity="0.3"/>
  </g>

  <!-- Znak: planeta z pierścieniem. Ten sam kształt, co ikona aplikacji. -->
  <g transform="translate(150 150)">
    <circle r="96" fill="url(#poswiata)"/>
    <ellipse rx="88" ry="32" fill="none" stroke="#9db9ff" stroke-width="6"
             opacity="0.55" transform="rotate(-24)"/>
    <circle r="40" fill="url(#planeta)"/>
    <ellipse rx="88" ry="32" fill="none" stroke="#c4d5ff" stroke-width="6"
             opacity="0.9" transform="rotate(-24)"
             stroke-dasharray="96 400" stroke-dashoffset="-150"/>
    <circle cx="74" cy="-30" r="7" fill="#c4d5ff"/>
  </g>

  <text x="300" y="140" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,monospace"
        font-size="72" letter-spacing="18" fill="#f2f5ff">COSMOS</text>
  <text x="306" y="186" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif"
        font-size="21" fill="#9db9ff" letter-spacing="0.6">
    Hybrid local / cloud AI environment
  </text>
  <text x="306" y="219" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif"
        font-size="16" fill="#7d8bb5" letter-spacing="0.4">
    multimodal models · agents · MCP · edge inference
  </text>

  <line x1="300" y1="243" x2="640" y2="243" stroke="#2a3358" stroke-width="1"/>
  <text x="300" y="268" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,monospace"
        font-size="13" fill="#5f6b93">
    zero runtime dependencies · 99 behaviour test suites
  </text>
</svg>
